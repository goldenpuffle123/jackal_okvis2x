%YAML:1.2
# SPDX-FileCopyrightText: 2021-2023 Smart Robotics Lab, Imperial College London, Technical University of Munich
# SPDX-License-Identifier: CC0-1.0

general:
  # outputs
  results_directory:          "/home/haoming/02_okvis_results/"
  write_mesh_output: true

  # Sensor processing
  sensor_measurement_downsampling: 1
  depth_image_resolution_downsampling: 1

  # Submapping
  submap_kf_threshold: 5
  submap_overlap_ratio: 0.4
  submap_min_frames: 5
  near_plane: 0.4
  far_plane: 20.0

  # Alignment settings
  use_map_to_map_factors: false
  use_map_to_live_factors: false
  n_factors_per_state: 200 # number of points per depth images
  voxel_grid_resolution: 0.05
  sensor_error: 0.04 # 1-sigma for obsv. noise [m]

  # Network depth settings
  use_uncertainty: false

  # Enable exploration
  enable_exploration: false

map:
  dim:            [25.6, 25.6, 25.6]
  res:            0.05

data:
  # occupancy data
  surface_boundary:        0
  min_occupancy:           -100
  max_occupancy:            100
  log_odd_min:             -5.015
  log_odd_max:              5.015
  fs_integr_scale:         1
  const_surface_thickness: false
  uncertainty_model:       quadratic
  tau_min_factor:          3
  tau_max_factor:          12
  k_tau:                   0.02
  sigma_min_factor:        1      # minimum/maximum uncertainty := 3 x sigma_min_factor/sigma_max_factor * voxel_dim
  sigma_max_factor:        20     # minimum/maximum uncertainty := 3 x sigma_min_factor/sigma_max_factor * voxel_dim
  k_sigma:                 0.05